<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Logo Center Mark: Sophisticated Minimalist Store & Cloche Motif -->
  <g transform="translate(106, 106)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Base Plate -->
    <path d="M 20 230 L 280 230" stroke="#f4f4f5" stroke-width="20"/>
    <path d="M 50 255 L 250 255" stroke="#71717a" stroke-width="12"/>
    
    <!-- Dome Cloche Cover -->
    <path d="M 40 210 A 110 110 0 0 1 260 210 Z" fill="none" stroke="#f4f4f5" stroke-width="20"/>
    
    <!-- Dome Handle Knob -->
    <circle cx="150" cy="85" r="18" fill="url(#accent)"/>
    <path d="M 150 103 L 150 112" stroke="#f4f4f5" stroke-width="16"/>

    <!-- Subtle Brand Accent Star/Diamond -->
    <path d="M 150 150 L 156 165 L 171 171 L 156 177 L 150 192 L 144 177 L 129 171 L 144 165 Z" fill="url(#accent)"/>
  </g>
</svg>
